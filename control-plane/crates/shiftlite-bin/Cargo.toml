[package]
name = "shiftlite-bin"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "socks5"] }
shiftlite-api.workspace = true
shiftlite-auth.workspace = true
shiftlite-cluster.workspace = true
shiftlite-controller.workspace = true
shiftlite-core.workspace = true
shiftlite-crd.workspace = true
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
