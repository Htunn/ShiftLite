[workspace]
resolver = "2"
members = [
    "crates/shiftlite-core",
    "crates/shiftlite-crd",
    "crates/shiftlite-auth",
    "crates/shiftlite-cluster",
    "crates/shiftlite-controller",
    "crates/shiftlite-api",
    "crates/shiftlite-bin",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }

shiftlite-core = { path = "crates/shiftlite-core" }
shiftlite-crd = { path = "crates/shiftlite-crd" }
shiftlite-auth = { path = "crates/shiftlite-auth" }
shiftlite-cluster = { path = "crates/shiftlite-cluster" }
shiftlite-controller = { path = "crates/shiftlite-controller" }
shiftlite-api = { path = "crates/shiftlite-api" }
