server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin reverse proxy to the control plane so cookies and EventSource (SSE)
    # work without CORS (SPEC-001 UI notes). "control-plane" is the compose service name.
    location /api/ {
        proxy_pass http://control-plane:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE log streaming must not be buffered or cut off by a read timeout.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
    }

    location /healthz {
        proxy_pass http://control-plane:8080;
    }

    location /readyz {
        proxy_pass http://control-plane:8080;
    }

    # Client-side routing (React Router) — fall back to index.html for unknown paths.
    location / {
        try_files $uri /index.html;
    }
}
